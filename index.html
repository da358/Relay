<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay 260908.7</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --ink:#0E141B; --panel:#151D26; --panel-2:#1B2530; --rule:#26333F;
    --graphite:#8A9AAB; --paper:#E6EDF3; --amber:#E8A33D; --cyan:#4FB6C8;
    --green:#4FA557; --red:#D6453F; --violet:#9B8CE0;
    /* Every declared text size is a multiple of this, so one number changes
       all of them. Held at 1 here, which is the size everything was designed
       at; the control in the header sets it on the players' panels only, so
       the header itself keeps the fixed height the layout assumes. */
    --ts:1;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:#070B0F; color:var(--paper); font-family:var(--sans);
       -webkit-font-smoothing:antialiased; overflow:hidden; font-size:calc(14px * var(--ts))}
  button{font-family:inherit; font-size:calc(13px * var(--ts))}
  .eyebrow{font-family:var(--mono); font-size:calc(10px * var(--ts)); letter-spacing:.16em;
           text-transform:uppercase; color:var(--graphite)}

  /* ---------- test harness chrome ---------- */
  #top{display:flex; align-items:baseline; gap:12px; padding:8px 14px;
       border-bottom:1px solid var(--rule); background:var(--ink);
       /* the panels below are sized as 100vh minus this bar, so it is pinned
          rather than left to whatever its tallest child turns out to be */
       height:37px; box-sizing:border-box; overflow:hidden}
  #top h1{margin:0; font-size:calc(15px * var(--ts)); font-weight:650; letter-spacing:.01em}
  #top h1 em{font-style:normal; color:var(--graphite); font-weight:400; font-size:calc(13px * var(--ts))}
  .ver{font-family:var(--mono); font-size:calc(10px * var(--ts)); letter-spacing:.1em;
       color:var(--amber); border:1px solid var(--rule); border-radius:2px; padding:2px 7px}
  #top .hint{margin-left:auto; font-family:var(--mono); font-size:calc(10px * var(--ts)); color:var(--graphite)}
  #ts{display:flex; align-items:center; gap:6px; align-self:center}
  #ts span{font-family:var(--mono); font-size:calc(10px * var(--ts));
           letter-spacing:.1em; text-transform:uppercase; color:var(--graphite)}
  #ts button{font-family:var(--sans); font-weight:650; color:var(--graphite);
             background:transparent; border:1px solid var(--rule); border-radius:3px;
             width:24px; height:20px; cursor:pointer; line-height:1}
  #ts button:hover{color:var(--paper); border-color:var(--graphite)}

  #lay{display:flex; gap:0; margin-left:14px}
  #lay button{font-family:var(--mono); font-size:calc(10px * var(--ts)); letter-spacing:.1em;
              text-transform:uppercase; color:var(--graphite); background:transparent;
              border:1px solid var(--rule); padding:3px 9px; cursor:pointer}
  #lay button + button{border-left:0}
  #lay button:first-child{border-radius:3px 0 0 3px}
  #lay button:last-child{border-radius:0 3px 3px 0}
  #lay button.on{color:var(--ink); background:var(--cyan); border-color:var(--cyan)}

  #harness{display:flex; height:calc(100vh - 37px)}
  .player{flex:1 1 50%; min-width:0; display:flex; flex-direction:column;
          background:var(--ink); position:relative; overflow:hidden}
  .player + .player{border-left:2px solid #04070A}
  /* one player at full width: layout is judged here, never in a half-width panel */
  #harness[data-lay=host]  .player:nth-child(2),
  #harness[data-lay=guest] .player:nth-child(1){display:none}
  #harness[data-lay=host]  .player:nth-child(1),
  #harness[data-lay=guest] .player:nth-child(2){flex:1 1 100%; border-left:0}
  /* the real thing: one player, one window, full width */
  .player:only-child{flex:1 1 100%; border-left:0}
  .hint.off{color:var(--amber)}
  .whobar{display:flex; align-items:center; gap:8px; padding:5px 10px;
          background:#0A1016; border-bottom:1px solid var(--rule); flex:0 0 auto}
  .whobar b{font-size:calc(11px * var(--ts)); font-weight:600}
  .whobar .role{font-family:var(--mono); font-size:calc(10px * var(--ts)); letter-spacing:.12em;
                text-transform:uppercase; padding:1px 6px; border-radius:2px;
                border:1px solid var(--rule); color:var(--graphite)}
  .whobar .role.architect{color:var(--amber); border-color:#4A3A1C}
  .whobar .role.builder{color:var(--cyan); border-color:#1C3D45}
  .whobar .spacer{margin-left:auto}

  .phases{flex:1 1 auto; min-height:0; position:relative}
  .phase{position:absolute; inset:0; display:none; flex-direction:column; overflow:auto}
  .phase.on{display:flex}

  /* ---------- shared bits ---------- */
  .pad{padding:14px}
  .card{background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:12px}
  .card + .card{margin-top:10px}
  h2{margin:0 0 3px; font-size:calc(15px * var(--ts)); font-weight:600}
  h3{margin:0 0 8px; font-size:calc(12px * var(--ts)); font-weight:600; color:var(--paper)}
  p.sub{margin:0 0 10px; color:var(--graphite); font-size:calc(12px * var(--ts)); line-height:1.5}
  label.f{display:block; margin:0 0 9px}
  label.f span{display:block; font-size:calc(11px * var(--ts)); color:var(--graphite); margin-bottom:3px}
  input[type=text]{width:100%; background:var(--ink); border:1px solid var(--rule);
    color:var(--paper); border-radius:3px; padding:7px 9px; font-family:var(--sans); font-size:calc(13px * var(--ts))}
  input[type=text]:focus{outline:2px solid var(--cyan); outline-offset:1px; border-color:var(--cyan)}
  input.code{font-family:var(--mono); letter-spacing:.28em; text-transform:uppercase; font-size:calc(16px * var(--ts))}
  .btn{background:var(--panel-2); color:var(--paper); border:1px solid var(--rule);
       border-radius:3px; padding:7px 12px; cursor:pointer; transition:.14s ease}
  .btn:hover:not(:disabled){border-color:var(--graphite)}
  .btn:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
  .btn:disabled{opacity:.35; cursor:default}
  .btn.go{background:var(--amber); border-color:var(--amber); color:#1A1206; font-weight:600}
  .btn.go:hover:not(:disabled){filter:brightness(1.08)}
  .btn.quiet{background:transparent; color:var(--graphite); border-color:transparent; padding:5px 8px}
  .btn.quiet:hover{color:var(--paper)}
  .btn.danger{border-color:#5A2320; color:#F0A7A3}
  /* .wide is deliberately unused now. A page-wide button reads as a banner,
     not a button; every button is sized to its own text. */
  .btn.wide{width:auto}

  /* the landing page. Two ways in, side by side and narrowed, with only one of
     them needed — so the pair has to see at a glance which is theirs. */
  .entry{max-width:720px; margin:0 auto}
  .lobwrap{max-width:720px; margin:0 auto}
  /* players are told they are "going back to the lobby", so the page should
     say which page that is */
  .lobtitle{font-family:var(--mono); font-size:calc(13px * var(--ts));
            letter-spacing:.3em; text-transform:uppercase; color:var(--cyan);
            text-align:center; margin:0 0 10px}
  .card.centred{text-align:center}
  .card.centred .teamcode{margin-left:auto; margin-right:auto}
  .entrytwo{display:flex; gap:26px; align-items:stretch}
  .entrytwo > .card{flex:1 1 50%; min-width:0; margin-top:0; display:flex;
    flex-direction:column}
  .entrytwo > .card.first{border-color:#2E4A52}
  .orbar{flex:0 0 auto; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; padding:0}
  .orbar em{font-family:var(--mono); font-size:calc(17px * var(--ts)); letter-spacing:.18em;
    text-transform:uppercase; color:var(--paper); font-style:normal;
    border:1px solid var(--rule); border-radius:999px; width:40px; height:40px;
    display:flex; align-items:center; justify-content:center; text-indent:.18em;
    background:var(--panel-2); flex:0 0 auto}
  .orbar i{flex:1 1 auto; width:1px; background:var(--rule); min-height:18px}
  .whoneeds{font-size:calc(11.5px * var(--ts)); color:var(--graphite); margin:-2px 0 9px}
  .card h3 .tagnum{display:inline-block; font-family:var(--mono); font-size:calc(10px * var(--ts));
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink);
    background:var(--cyan); border-radius:2px; padding:1px 6px; margin-right:7px;
    vertical-align:1px}
  .card h3 .tagnum.quiet{background:transparent; color:var(--graphite);
    border:1px solid var(--rule)}
  .entryfoot{margin-top:auto; padding-top:4px}
  @media (max-width: 620px){
    .entrytwo{flex-direction:column}
    .entrytwo{gap:14px}
    .orbar{flex-direction:row; padding:0}
    .orbar i{height:1px; width:auto; min-height:0; min-width:18px; flex:1 1 auto}
  }
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .err{color:#F0A7A3; font-size:calc(12px * var(--ts)); margin:6px 0 0; min-height:15px}
  .note{color:var(--graphite); font-size:calc(11px * var(--ts)); line-height:1.5}
  .kv{font-family:var(--mono); font-size:calc(11px * var(--ts)); color:var(--graphite)}

  .choices{display:flex; flex-direction:column; gap:6px}
  .choice{display:flex; gap:9px; align-items:flex-start; text-align:left; width:100%;
    background:var(--panel-2); border:1px solid var(--rule); border-radius:3px;
    padding:8px 10px; cursor:pointer; color:var(--paper); transition:.14s ease}
  .choice:hover:not(:disabled){border-color:var(--graphite)}
  .choice[aria-pressed=true]{border-color:var(--amber); background:#241C0E}
  .choice:disabled{opacity:.5; cursor:default}
  .choice b{font-size:calc(12.5px * var(--ts)); font-weight:600; display:block}
  .choice small{color:var(--graphite); font-size:calc(11px * var(--ts)); display:block; margin-top:1px}
  .choice .mark{width:14px; height:14px; border-radius:50%; border:1px solid var(--rule);
    flex:0 0 auto; margin-top:1px}
  .choice[aria-pressed=true] .mark{background:var(--amber); border-color:var(--amber)}

  .teamcode{font-family:var(--mono); font-size:calc(30px * var(--ts)); letter-spacing:.32em;
    color:var(--amber); text-align:center; padding:10px 0 6px}

  /* ---------- play ---------- */
  .playtop{display:flex; align-items:center; gap:8px; padding:6px 10px;
    border-bottom:1px solid var(--rule); background:#0A1016; flex:0 0 auto}
  .clock{font-family:var(--mono); font-size:calc(15px * var(--ts)); letter-spacing:.06em}
  .clock.over{color:var(--amber)}
  .track{flex:1 1 auto; height:5px; background:var(--panel-2); border-radius:3px;
    position:relative; overflow:hidden; min-width:40px}
  .track i{position:absolute; left:0; top:0; bottom:0; background:var(--cyan); width:0}
  .track i.over{background:var(--amber)}
  .track u{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--paper); opacity:.75}
  .stagewrap{flex:1 1 auto; position:relative; min-height:160px}
  .stagewrap canvas{display:block; width:100%; height:100%}
  /* --d is set from the stage size in the frame loop. The dial is a compass for
     the 3D scene and the scene scales with the canvas, so a fixed-size dial
     drifts out of proportion and reads as tiny on a large window. Everything
     inside is a fraction of --d, so one number resizes the whole control. */
  .dial{position:absolute; right:10px; bottom:10px; --d:84px;
    width:var(--d); height:var(--d)}
  .dial-plate{position:absolute; inset:calc(var(--d) * 0.25);
    border:1px solid var(--rule); opacity:.9;
    background:linear-gradient(var(--rule) 1px, transparent 1px) 0 0/100% 20%,
               linear-gradient(90deg, var(--rule) 1px, transparent 1px) 0 0/20% 100%}
  .cam{position:absolute; width:calc(var(--d) * 0.286); height:calc(var(--d) * 0.286);
    padding:0; background:rgba(21,29,38,.9);
    color:var(--graphite); border:1px solid var(--rule); border-radius:50%;
    font-family:var(--mono); font-size:calc(var(--d) * 0.131); cursor:pointer;
    display:grid; place-items:center; transition:.16s ease}
  .cam:hover{color:var(--paper); border-color:var(--graphite)}
  .cam[aria-pressed="true"]{background:var(--amber); border-color:var(--amber);
    color:#1A1206; font-weight:600}
  .cam.v1{right:0; bottom:0} .cam.v2{left:0; bottom:0}
  .cam.v3{left:0; top:0}     .cam.v4{right:0; top:0}
  .slotname{position:absolute; left:10px; top:8px; font-family:var(--mono); font-size:calc(11px * var(--ts));
    color:var(--graphite); background:rgba(14,20,27,.8); padding:3px 7px; border-radius:2px;
    border:1px solid var(--rule)}

  /* card strip */
  .strip{flex:0 0 auto; display:flex; gap:6px; padding:7px 8px; overflow-x:auto;
    border-top:1px solid var(--rule); background:#0A1016}
  .cardbtn{flex:0 0 auto; width:74px; background:var(--panel); border:1px solid var(--rule);
    border-radius:3px; padding:3px; cursor:pointer; color:var(--paper); transition:.14s ease}
  .cardbtn:hover{border-color:var(--graphite)}
  .cardbtn img{display:block; width:100%; border-radius:2px; background:#0C1218}
  .cardbtn .cn{font-family:var(--mono); font-size:calc(9.5px * var(--ts)); color:var(--graphite);
    display:flex; justify-content:space-between; padding:2px 2px 0}
  .cardbtn.active{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset}
  .cardbtn.proposed{border-color:var(--amber)}
  .cardbtn.done .cn{color:var(--green)}
  .cardbtn.reopened .cn{color:var(--amber)}

  /* builder rail */
  .rail{flex:0 0 auto; border-top:1px solid var(--rule); background:#0A1016;
    padding:11px 12px 13px; display:flex; gap:26px; align-items:flex-start}
  /* the pill and the colors are one group: the colors only do anything in ADD,
     so they sit under the control that selects it and dim when it is not chosen */
  .actgroup{flex:0 0 auto; display:flex; flex-direction:column; gap:9px;
    align-items:flex-start}
  .swatches{transition:opacity .16s ease}
  .swatches.idle{opacity:.35}
  /* one sliding pill, prominent. Three stacked buttons read as a settings list;
     a segmented control reads as "you are in one of these modes". */
  .pill{position:relative; display:inline-flex; align-self:flex-start; flex:0 0 auto;
    background:var(--panel-2); border:1px solid var(--rule); border-radius:999px; padding:3px}
  .pill i{position:absolute; top:3px; bottom:3px; left:0; width:0; border-radius:999px;
    background:var(--cyan); transition:left .16s cubic-bezier(.4,0,.2,1),
    width .16s cubic-bezier(.4,0,.2,1)}
  .pill button{position:relative; z-index:1; background:transparent; border:0; cursor:pointer;
    font-family:var(--mono); font-size:calc(12px * var(--ts)); letter-spacing:.14em; text-transform:uppercase;
    color:var(--graphite); padding:9px 18px; border-radius:999px; white-space:nowrap;
    transition:color .16s}
  .pill button[aria-pressed=true]{color:var(--ink); font-weight:600}
  .pill button:focus-visible{outline:2px solid var(--paper); outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ .pill i, .pill button{transition:none} }
  /* the pill's 1px border plus 3px padding is where the slider itself starts */
  .swatches{display:flex; gap:6px; flex-wrap:wrap; margin-left:4px}
  .sw{width:26px; height:26px; border-radius:3px; border:2px solid transparent; cursor:pointer; padding:0}
  .sw[aria-pressed=true]{border-color:var(--paper)}
  .sw:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
  .railnote{flex:1 1 auto; min-width:0}
  /* it drops in once the coachmarks are closed: two messages competing for
     attention at the start of a level meant neither got read */
  .warmbar{margin:0 8px 8px; padding:9px 11px; background:var(--panel-2);
    border:1px solid var(--rule); border-left:2px solid var(--cyan); border-radius:3px;
    opacity:0; transform:translateY(-14px); transition:opacity .28s ease,
    transform .28s cubic-bezier(.2,.8,.2,1)}
  .warmbar.in{opacity:1; transform:none}
  @media (prefers-reduced-motion: reduce){ .warmbar{transition:none} }
  .warmbar .sub{margin:0 0 8px; font-size:calc(12.5px * var(--ts)); line-height:1.55}
  .warmbar .row{gap:10px; align-items:center}

  /* the ribbon layer. An inline svg is a replaced element: absolute inset does
     not stretch it, so fitOverlay sets width and height explicitly. */
  .over{position:absolute; left:0; top:0; width:100%; height:100%;
    overflow:visible; pointer-events:none; display:block}
  .over .hit{pointer-events:auto; cursor:pointer}

  .ring{position:absolute; width:44px; height:44px; margin:-22px 0 0 -22px; pointer-events:none;
    opacity:0; transition:opacity .1s}
  .ring.on{opacity:1}
  .ring text{fill:var(--paper); font-family:var(--mono); font-size:calc(13px * var(--ts))}

  /* ---------- review ---------- */
  /* the panels are the review. The first build sized them for a split test
     window and they were unreadable; each player has a whole screen. */
  .twoup{display:flex; gap:8px; padding:0 8px 8px; flex:1 1 auto; min-height:0}
  .twoup > div{flex:1 1 50%; min-width:0; display:flex; flex-direction:column; min-height:0;
    position:relative}
  .twoup h4{margin:0 0 3px; font-family:var(--mono); font-size:calc(10px * var(--ts)); letter-spacing:.14em;
    text-transform:uppercase; color:var(--graphite); flex:0 0 auto}
  .mini{position:relative; flex:1 1 auto; min-height:260px; border:1px solid var(--rule);
    border-radius:3px; background:#0C1218; overflow:hidden}
  .mini canvas{display:block; width:100%; height:100%}
  .tip{position:absolute; pointer-events:none; z-index:20; background:rgba(9,14,19,.96);
    border:1px solid var(--rule); border-radius:3px; padding:5px 9px; font-size:calc(12px * var(--ts));
    color:var(--paper); transform:translate(-50%,-150%); white-space:nowrap;
    opacity:0; transition:opacity .1s}
  .tip.on{opacity:1}
  .hiddennote{padding:0 10px 8px; font-size:calc(12px * var(--ts)); color:var(--amber)}
  .verdictbar{display:flex; align-items:center; gap:8px; padding:8px 10px}
  .vtag{font-family:var(--mono); font-size:calc(11px * var(--ts)); letter-spacing:.12em; text-transform:uppercase;
    padding:3px 8px; border-radius:2px; border:1px solid var(--rule); color:var(--graphite)}
  .vtag.perfect{color:#7FD98A; border-color:#245C2C; background:#122515}
  .vtag.bad{color:#F0A7A3; border-color:#5A2320; background:#241213}
  .vtag.near{color:var(--amber); border-color:#4A3A1C; background:#241C0E}
  .difflegend{display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:calc(11.5px * var(--ts));
    color:var(--graphite); padding:0 10px 8px}
  .difflegend .chip{display:inline-flex; align-items:center; gap:6px}
  .difflegend .words{color:var(--paper); font-size:calc(13px * var(--ts))}

  /* perfect builds is the headline. Submitted is secondary. The other two are
     facilitator diagnostics, not player scores: one quiet line. */
  .headline{display:flex; align-items:baseline; gap:14px; margin-top:10px}
  .headline .big{font-family:var(--mono); font-size:calc(52px * var(--ts)); line-height:.9; color:var(--green)}
  .headline .big.zero{color:var(--graphite)}
  .headline .biglab{font-size:calc(14px * var(--ts)); color:var(--paper)}
  .headline .biglab span{display:block; font-size:calc(11.5px * var(--ts)); color:var(--graphite); margin-top:2px}
  .secondline{margin-top:10px; padding-top:9px; border-top:1px solid var(--rule);
    font-size:calc(12.5px * var(--ts)); color:var(--paper)}
  .quietline{margin-top:5px; font-size:calc(11.5px * var(--ts)); color:var(--graphite)}
  .roundlist{display:flex; flex-direction:column; gap:4px}
  .roundlist button{display:flex; gap:8px; align-items:baseline; background:var(--panel-2);
    border:1px solid var(--rule); border-radius:3px; padding:6px 9px; cursor:pointer;
    color:var(--paper); font-size:calc(12px * var(--ts)); text-align:left}
  .roundlist button:hover{border-color:var(--graphite)}
  .roundlist small{color:var(--graphite); margin-left:auto; font-family:var(--mono); font-size:calc(10px * var(--ts))}

  /* ---------- overlays ---------- */
  .veil{position:absolute; inset:0; background:rgba(7,11,15,.82); display:none;
    align-items:center; justify-content:center; padding:18px; z-index:40}
  .veil.on{display:flex}
  .modal{background:var(--panel); border:1px solid var(--rule); border-radius:5px;
    padding:16px; max-width:340px; width:100%; box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .modal h3{font-size:calc(14px * var(--ts)); margin-bottom:6px}
  .modal p{margin:0 0 12px; font-size:calc(12.5px * var(--ts)); line-height:1.55; color:#C6D2DD}
  .modal .row{justify-content:flex-end}
  /* ---------- coachmarks (5.8) ----------
     Non-blocking by construction: no veil, and the box is the only thing that
     takes pointer events, so the control it points at stays live. Pressing that
     control does not dismiss the box. */
  .coachlayer{position:absolute; inset:0; z-index:45; pointer-events:none}
  /* No border and no background: the outline and the fill are one SVG path
     drawn behind this, so the box and its tail are a single continuous shape
     rather than a rectangle with a separate triangle stuck to it. */
  .coach{position:absolute; pointer-events:auto; width:262px; max-width:76%;
    background:transparent; border:0; border-radius:4px;
    padding:12px 13px 11px; visibility:hidden}
  .coach.on{visibility:visible}
  .coach h5{margin:0 0 5px; font-size:calc(13.5px * var(--ts)); color:var(--paper); font-weight:600}
  .coach p{margin:0 0 9px; font-size:calc(12.5px * var(--ts)); line-height:1.5; color:var(--graphite)}

     filled as if closed but stroked only down the two slanted edges, so the
     base is invisible and the tail can be any length. */

     edge faces the target. Lives in the layer so it can be drawn behind the

  .coachlayer svg.cshell{position:absolute; left:0; top:0; display:none;

  function turnMatters(round){

  function coachSeqFor(role, lv, seen, warm){
    return COACH.filter(function(bx){
      if (warm && !bx.warm) return false;
      if (bx.role !== role && !(warm && bx.warmBoth)) return false;
      if (bx.strip && !lv.strip) return false;
      if (seen[bx.id]) return false;

      var px = Math.floor(hit.point.x), pz = Math.floor(hit.point.z);

      return { kind:"cell", x:px, y:0, z:pz };

  /* ==========================================================
     14c. THE FOLDED RIBBON        [verbatim from testbed 260906.5]
     Rebuilt from straight_arrow_with_reference_line.svg: the strip is
     56.6 long, folds at 42.6% from the tail, the shaft is 6.5% of the
     length wide and the head 18.8%. Those proportions are held and the
     whole thing is generated on the cube's real projected edge, so it
     stays glued to the edge in perspective and from any view.

    tail: 0.259,     // how far the tail reaches onto the source face, in cube widths
    head: 0.349,     // how far the head reaches onto the destination face
    headLen: 0.159,  // of that, how much is arrowhead
    halfW: 0.060,    // half the shaft width

    var B = M.clone().add(d2.clone().multiplyScalar((RIB.head-RIB.headLen)*k));

    // roles default: same as last round, reversed when stepping up to Level 3
    function defaultRoles(s, lv){
      var last = s.finished.length ? s.finished[s.finished.length-1] : null;
      if (!last) return s.lobby ? s.lobby.hostRole : "architect";
      var wasHost = last.roles.host;
      if (lv.id === "L3" && last.levelId !== "L3")
        return wasHost === "architect" ? "builder" : "architect";
      return wasHost;
    }
    C.defaultRoles = defaultRoles;

    /* the guest's confirmation of a proposed round */
    function checkProposal(s){
      if (C.kind !== "guest") return;
      var L = s.lobby;
      /* Compare by value, not by identity. Both players used to share one
         object in memory; now each snapshot arrives as fresh objects parsed
         from the network, so an identity test never matches and this raised
         the same confirmation on every repaint. The second press then ran
         startRound with the proposal already cleared. The `at` stamp is what
         makes a re-proposal of identical settings count as a new one. */
      var psig = JSON.stringify(L.proposal);
      if (!L || !L.proposal || C.sawProposal === psig) return;
      C.sawProposal = psig;
      var lv = levelOf(L.proposal.levelId);
      var myRole = L.proposal.hostRole === "architect" ? "Builder" : "Architect";
      var theirRole = L.proposal.hostRole === "architect" ? "Architect" : "Builder";
      var t = s.team;
      var timeBit = lv.targetLocked ? "no time limit"
        : (L.proposal.targetMin === null ? "no time limit"
           : "a target of " + L.proposal.targetMin + " minutes");
      ask("Ready to start?",
        t.host.name + " has picked Level " + lv.n + " \u2014 " + lv.name + ", with " + timeBit +
        ". They will be the " + theirRole + ", you will be the " + myRole + ".",
        "Start the round",
        function(){ startRound(); },
        "Cancel",
        function(){
          SHARED.write(function(st){
            st.lobby.locked = false; st.lobby.proposal = null; st.lobby.rejected = true;
          });
        });
    }

      UI.railBar = el("div","");
      UI.railNote.appendChild(UI.railBar);
      UI.railMsg = el("div","note","");
      UI.railNote.appendChild(UI.railMsg);
      UI.submit = el("button","btn go","Submit this build");
      UI.submit.style.marginTop = "6px";
      UI.railNote.appendChild(UI.submit);

      UI.endBtn.onclick = function(){
        var s = SHARED.read(), r = s.round; if (!r) return;
        ask("End the round for both of you?",
          "This ends the whole round, for you and your teammate, not just this design. "+
          "Anything unfinished is recorded as not submitted.",
          "End the round", function(){ endRound(C.kind); }, "Keep going");
      };
      UI.helpBtn.onclick = function(){ showHelp(); };
      UI.exitBtn.onclick = function(){
        ask("Leave the round?", "You will go back to the lobby. The round is not saved.",
            "Leave", function(){
              SHARED.write(function(s){ s.round = null; s.phase = "lobby";
                                        s.lobby.locked = false; s.lobby.proposal = null; });
            }, "Stay");
      };
      UI.submit.onclick = function(){ submitBuild(); };
    })();

    function myRole(s){
      if (!s.round) {
        var L = s.lobby;
        if (!L) return "architect";
        return C.kind === "host" ? L.hostRole : (L.hostRole==="architect"?"builder":"architect");
      }
      return s.round.roles[C.kind];
    }
    C.myRole = myRole;

    function ensureCanvas(host){
      if (!UI.stageCanvas) UI.stageCanvas = document.createElement("canvas");
      if (host && UI.stageCanvas.parentNode !== host)
        host.insertBefore(UI.stageCanvas, host.firstChild);
      return UI.stageCanvas;
    }
    C.ensureCanvas = ensureCanvas;
    function ensureStage(){
      if (UI.stage) return UI.stage;
      if (!UI.stageCanvas || !UI.stageCanvas.clientWidth) return null;
      UI.stage = makeViewer(UI.stageCanvas, { plate:true });
      UI.stage.resize();
      wireStage();
      C.stageIsNew = true;
      return UI.stage;
    }
    function setView(ix){
      var V = ensureStage(); if (!V) return;
      V.stepTo(ix);
      UI.camBtns.forEach(function(b,k){ b.setAttribute("aria-pressed", String(k===ix)); });
    }
    /* ---------- the folded ribbons (brief 5.7), lifted from testbed 260906.5 ----------
       Settled: select a cube, then all six ribbons appear on it and stay. The rest
       of the build fades to 26% so nothing sits in front of them, the selected cube
       is lit on all six faces so the mark being turned up is legible, ribbons are
       drawn on covered faces too, and a quarter turn takes 220ms. */
    var RIBFILL = "#74C6D8", RIBHOT = "#B7E7F0", TURNMS = 220;
    var turnAnim = null;

    function ribbonsLive(s){
      if (!UI.over) return false;
      if (C.tool !== "turn" || C.selected < 0) return false;
      if (s.phase === "warmup") return true;
      return !!s.round && turnMatters(s.round) && myRole(s) === "builder";
    }
    function turnCubes(s){
      return s.phase === "warmup" ? (C.warmCubes || []) : workOn(s);
    }
    function applyTurn(i, newO){
      var s = SHARED.read(), list = turnCubes(s);
      if (!list[i] || newO === list[i].o) return;
      var oldO = list[i].o;
      list[i].o = newO;
      if (s.phase !== "warmup") touched();
      if (!reduceMotion && TURNMS > 0){
        var fromQ = (turnAnim && turnAnim.i === i) ? turnAnim.cur.clone()
                                                   : ORI[oldO].quat.clone();
        turnAnim = { i:i, from:fromQ, to:ORI[newO].quat.clone(), t:0, cur:fromQ.clone() };
      } else turnAnim = null;
      repaintWork();
    }
    /* the cube carries its orientation as a quaternion, so the turn is a slerp.
       The ribbons wrap the cell's edges, which do not move while the cube spins
       in place, so they stay true throughout and need no special handling. */
    function stepTurn(dt){
      if (!turnAnim) return;
      var V = UI.stage; if (!V) { turnAnim = null; return; }
      turnAnim.t = Math.min(1, turnAnim.t + dt/(TURNMS/1000));
      var g = V.group.children[turnAnim.i];
      if (g && g.userData.body){
        turnAnim.cur.copy(turnAnim.from).slerp(turnAnim.to, ease(turnAnim.t));
        g.userData.body.quaternion.copy(turnAnim.cur);
      }
      if (turnAnim.t >= 1) turnAnim = null;
    }
    function drawArms(){
      if (!UI.over) return;
      clear(UI.over);
      var V = UI.stage; if (!V) return;
      fitOverlay(UI.over, UI.stageCanvas);
      var s = SHARED.read();
      if (!ribbonsLive(s)) return;
      var list = turnCubes(s), i = C.selected;
      if (!list[i]) return;

      var defs = sel("defs");
      var f = sel("filter", { id:"rsh", x:"-50%", y:"-50%", width:"200%", height:"200%" });
      f.appendChild(sel("feDropShadow", { dx:"0", dy:"1.5", stdDeviation:"1.6",
                                          "flood-color":"#000", "flood-opacity":"0.55" }));
      defs.appendChild(f); UI.over.appendChild(defs);

      armsFor(V, list, i, { skipCovered:false }).forEach(function(arm, k){
        var t = (k % 2 === 0) ? RIB.t1 : RIB.t2;
        var d = ribbonPath(V, arm.a, arm.b, arm.f1, arm.f2, t);
        var path = sel("path", { d:d, fill:RIBFILL, stroke:"#000000", "stroke-width":1.1,
                                 "stroke-linejoin":"round", class:"hit", filter:"url(#rsh)" });
        path.addEventListener("pointerdown", function(ev){
          ev.stopPropagation();
          applyTurn(i, rotFor(list[i].o, arm.from, arm.to));
        });
        path.addEventListener("pointerenter", function(){ path.setAttribute("fill", RIBHOT); });
        path.addEventListener("pointerleave", function(){ path.setAttribute("fill", RIBFILL); });
        UI.over.appendChild(path);
      });
    }
    C.drawArms = drawArms;
    C.stepTurn = stepTurn;

    /* ---------- the action pill ---------- */
    function layoutPill(){
      var b = UI.toolBtns[C.tool];
      if (!b || !UI.pillFill) return;
      if (b.style.display === "none" || !b.offsetWidth) return;
      UI.pillFill.style.left = b.offsetLeft + "px";
      UI.pillFill.style.width = b.offsetWidth + "px";
    }
    function setTool(t){
      var s = SHARED.read();
      /* TURN is not offered when a turn cannot matter, so it cannot be reached */
      if (t === "turn" && s.phase !== "warmup" && !turnMatters(s.round)) t = "place";
      C.tool = t;
      if (t !== "turn") C.selected = -1;
      Object.keys(UI.toolBtns).forEach(function(k){
        UI.toolBtns[k].setAttribute("aria-pressed", String(k===t));
      });
      paintPlay(s);
      layoutPill();
    }

    /* ---- the builder's working copy ---- */
    function workOn(s){
      var r = s.round; if (!r) return [];
      var e = r.deck[r.activeSlot];
      /* keyed by design id, not slot index. Round 1 deals a fresh design into
         slot 0, and a slot-keyed cache handed it the previous build. Reopening
         the same design still finds its own work, which is what we want. */
      var k = e.design.id;
      if (!C.localBuild[k]){
        C.localBuild[k] = e.build ? cloneCubes(e.build) : [];
      }
      return C.localBuild[k];
    }
    function touched(){
      var s = SHARED.read(), r = s.round; if (!r) return;
      var e = r.deck[r.activeSlot];
      if (e.submitted){
        SHARED.write(function(st){
          var en = st.round.deck[st.round.activeSlot];
          en.submitted = false; en.reopened = true;
          st.round.openNonce = (st.round.openNonce || 0) + 1;
        });
        C.say("Reopened \u2014 submit it again for it to count");
      }
    }
    function bump(field, n){
      var s = SHARED.read(); if (!s.round) return;
      SHARED.write(function(st){
        st.round.deck[st.round.activeSlot][field] += (n===undefined?1:n);
      });
    }

    function wireStage(){
      var V = UI.stage, hold = null;
      var ringFg = UI.ring.querySelector(".fg"), ringTx = UI.ring.querySelector("text");
      var CIRC = 2*Math.PI*19;
      ringFg.style.strokeDasharray = CIRC;
      ringFg.style.strokeDashoffset = CIRC;

      function iAmBuilder(){
        var s = SHARED.read();
        return s.round && myRole(s) === "builder" && s.phase !== "review";
      }
      function ctx(){
        var s = SHARED.read();
        if (s.phase === "warmup") return { cubes:C.warmCubes || (C.warmCubes = []),
                                           rule:"grounded", famk:"sym", faceMode:"top", warm:true };
        var r = s.round, d = r.deck[r.activeSlot].design;
        return { cubes:workOn(s), rule:d.rule, famk:d.glyphs, faceMode:d.faces, warm:false };
      }
      V.canvas.addEventListener("pointermove", function(ev){
        if (!iAmBuilder() && SHARED.read().phase !== "warmup") return;
        if (hold){ moveRing(ev); return; }
        if (ev.pointerType === "touch") return;
        var K = ctx();
        showGhostIn(V, pickIn(V, ev, K.cubes, K.rule, C.tool, C.handOri, C.colour),
                    K.cubes, K.rule, C.tool, C.handOri, C.colour, K.famk);
      });
      V.canvas.addEventListener("pointerleave", function(){ cancelHold(); V.ghost.visible = false; });
      V.canvas.addEventListener("pointerdown", function(ev){
        try { onStageDown(ev); } catch(e){ boom("stage pointerdown", e); }
      });
      function onStageDown(ev){
        var s = SHARED.read();
        if (!iAmBuilder() && s.phase !== "warmup") return;
        ev.preventDefault();
        var K = ctx();
        var p = pickIn(V, ev, K.cubes, K.rule, C.tool, C.handOri, C.colour);
        if (!p) return;
        if (p.kind === "empty"){ if (C.selected !== -1){ C.selected = -1; repaintWork(); } return; }
        if (p.kind === "cell" && C.tool === "place"){
          if (!K.warm) touched();
          K.cubes.push({ x:p.x, y:p.y, z:p.z, c:C.colour, o:C.handOri, fixed:false });
          repaintWork();
          return;
        }
        if (C.tool === "turn"){
          C.selected = (C.selected === p.i ? -1 : p.i);
          repaintWork();
          return;
        }
        if (C.tool === "erase") startHold(p, ev, K);
      }
      window.addEventListener("pointerup", cancelHold);

      function startHold(p, ev, K){
        var dm = doomed(K.cubes, K.rule, p.i);
        if (dm === null){ C.say("Take off what is resting on it first"); return; }
        hold = { doomed:dm, t:0, dur:Math.min(1600, 350+120*(dm.length-1))/1000, K:K,
                 home:dm.map(function(ix){
                   return [K.cubes[ix].x+0.5, K.cubes[ix].y+0.5, K.cubes[ix].z+0.5]; }) };
        UI.ring.classList.add("on"); moveRing(ev);
        ringTx.textContent = dm.length > 1 ? dm.length : "";
      }
      function moveRing(ev){
        var r = UI.stageHost.getBoundingClientRect();
        UI.ring.style.left = (ev.clientX - r.left)+"px";
        UI.ring.style.top  = (ev.clientY - r.top)+"px";
      }
      function cancelHold(){
        if (!hold) return;
        for (var i=0;i<hold.doomed.length;i++){
          var obj = V.group.children[hold.doomed[i]];
          if (obj) obj.position.set(hold.home[i][0], hold.home[i][1], hold.home[i][2]);
        }
        hold = null; UI.ring.classList.remove("on");
        ringFg.style.strokeDashoffset = CIRC;
      }
      V.stepHold = function(dt){
        if (!hold) return;
        hold.t += dt;
        var f = Math.min(1, hold.t/hold.dur);
        ringFg.style.strokeDashoffset = CIRC*(1-f);
        if (!reduceMotion){
          var amp = 0.035 + 0.075*f;
          for (var i=0;i<hold.doomed.length;i++){
            var obj = V.group.children[hold.doomed[i]];
            if (!obj) continue;
            obj.position.set(hold.home[i][0]+(Math.random()-0.5)*amp,
                             hold.home[i][1]+(Math.random()-0.5)*amp,
                             hold.home[i][2]+(Math.random()-0.5)*amp);
          }
        }
        if (f >= 1){
          var idxs = hold.doomed.slice().sort(function(a,b){ return b-a; });
          var K = hold.K;
          hold = null; UI.ring.classList.remove("on");
          ringFg.style.strokeDashoffset = CIRC;
          if (!K.warm) touched();
          for (var j=0;j<idxs.length;j++) K.cubes.splice(idxs[j],1);
          if (!K.warm) bump("deletions", idxs.length);
          C.selected = -1;
          V.ghost.visible = false;
          repaintWork();
        }
      };
    }

    function activeOri(){
      var s = SHARED.read();
      if (C.selected >= 0){
        var list = s.phase === "warmup" ? (C.warmCubes||[]) : workOn(s);
        if (list[C.selected]) return list[C.selected].o;
      }
      return C.handOri;
    }
    function setOri(o){
      var s = SHARED.read();
      if (C.selected >= 0){
        var list = s.phase === "warmup" ? (C.warmCubes||[]) : workOn(s);
        if (list[C.selected]){
          if (s.phase !== "warmup") touched();
          list[C.selected].o = o;
          repaintWork();
        }
      } else {
        C.handOri = o;
      }
    }
    function nudge(dir){
      var V = ensureStage(); if (!V) return;
      var sf = V.screenFaces(), o = activeOri();
      if (dir === "sl") o = turn(o,"y");
      else if (dir === "sr") o = turnBack(o,"y");
      else if (dir === "dn") o = tipOnto(o, sf.se);
      else if (dir === "up") o = tipOnto(o, sf.nw);
      setOri(o);
    }
    C.nudge = nudge;

    function repaintWork(){
      var s = SHARED.read(), V = ensureStage(); if (!V) return;
      if (s.phase === "warmup"){
        var wt = (C.tool === "turn" && C.selected >= 0);
        V.paint(C.warmCubes||[], "sym", { sel:C.selected, faceMode:"top", dim:true,
                                          brightSel: wt,
                                          faintOthers: wt ? 0.26 : null });
        drawArms();
        return;
      }
      var r = s.round; if (!r) return;
      var d = r.deck[r.activeSlot].design;
      var lv = levelOf(r.levelId);
      if (myRole(s) === "builder"){
        var turning = (C.tool === "turn" && C.selected >= 0);
        V.paint(workOn(s), d.glyphs, { sel:C.selected, faceMode:d.faces,
                                       dim: lv.dimMarks && r.settings.dimMarks,
                                       brightSel: turning,
                                       faintOthers: turning ? 0.26 : null });
      } else {
        var show = r.deck[C.previewSlot !== undefined && C.previewSlot !== null
                          ? C.previewSlot : r.activeSlot].design;
        V.paint(show.cubes, show.glyphs, { faceMode:show.faces,
                                           dim: lv.dimMarks && r.settings.dimMarks });
      }
      drawArms();
    }
    C.repaintWork = repaintWork;

    function submitBuild(){
      var s = SHARED.read(), r = s.round; if (!r) return;
      var slot = r.activeSlot, work = cloneCubes(workOn(s));
      if (!work.length){ C.say("Nothing on the plate yet"); return; }
      var el0 = NOW() - r.startedAt;
      SHARED.write(function(st){
        var e = st.round.deck[slot];
        e.build = work; e.submitted = true; e.reopened = false;
        e.submissions++;
        if (e.firstSubmitMs === null) e.firstSubmitMs = el0;
      });
      C.say("Submitted \u00b7 Design " + (slot+1));
    }

    function showHelp(){
      var s = SHARED.read();
      var mine = myRole(s);
      var body = mine === "architect"
        ? "You can see the design; your teammate cannot. Use the four numbered views \u2014 "+
          "they are the same four on both screens, so \"view 3\" means one thing to both of you. "+
          "Tap a card to look ahead. The board only moves when your teammate agrees."
        : "You cannot see the design. Place cubes by clicking the plate or the side of a cube. "+
          "Hold on a cube with Take off to remove it. Arrow keys turn the cube in hand, and they "+
          "follow whichever view you are looking from.";
      tell("How this works", body, "Back to it");
    }
    C.showHelp = showHelp;

    /* ---------- painting the play screen ---------- */
    /* Every new or reopened design resets both players to view 1 and the
       Builder's tool to ADD. The reset has to be driven from shared state, not
       locally, or the two screens drift apart on the very thing the game is
       about: "view 3" meaning the same to both of you. The Round 1 carry-over
       was this redraw not happening. */
    function syncOpen(s){
      var r = s.round; if (!r) return;
      /* keyed by round as well as nonce: every new round starts its counter at
         1, so a bare number collides with the round before it and the reset
         silently does not happen. This was the "try another design" carry-over. */
      var n = r.id + ":" + (r.openNonce || 0);
      if (C.sawNonce === n) return;
      C.sawNonce = n;
      C.selected = -1;
      turnAnim = null;
      C.previewSlot = null;
      if (C.tool !== "place"){
        C.tool = "place";
        Object.keys(UI.toolBtns).forEach(function(k){
          UI.toolBtns[k].setAttribute("aria-pressed", String(k==="place"));
        });
      }
      var V = ensureStage();
      if (V){ V.snapTo ? V.snapTo(0) : V.stepTo(0); }
      UI.camBtns.forEach(function(b,k){ b.setAttribute("aria-pressed", String(k===0)); });
    }

    function paintPlay(s){
      var r = s.round; if (!r) return;
      var warm = (s.phase === "warmup");
      if (!warm) syncOpen(s);
      var mine = myRole(s), lv = levelOf(r.levelId);

      /* the warm-up banner sits above the stage; in the round it is not there */
      if (warm){
        /* held back until the coachmarks are done, then it slides in from
           behind the top bar */
        var reading = C.coachOpen();
        if (!reading && UI.warmBar.parentNode !== UI.pPlay){
          UI.pPlay.insertBefore(UI.warmBar, UI.stageHost);
          requestAnimationFrame(function(){ UI.warmBar.classList.add("in"); });
        }
        if (!reading) paintWarm(s);
      } else if (UI.warmBar.parentNode){
        UI.warmBar.classList.remove("in");
        UI.warmBar.parentNode.removeChild(UI.warmBar);
      }
      var V = ensureStage();
      var slot = r.activeSlot;
      var showSlot = (mine === "architect" && C.previewSlot !== null &&
                      C.previewSlot !== undefined) ? C.previewSlot : slot;

      UI.slotName.textContent = warm
        ? "Warm-up \u00b7 nothing here counts"
        : "Design " + (showSlot+1) +
          (r.deck.length > 1 ? " of " + r.deck.length : "") +
          (mine === "architect" && showSlot !== slot ? "  \u00b7  looking ahead" : "");

      if (V) repaintWork();

      /* strip: previews for the Architect only, and not before the round starts */
      UI.strip.style.display = (!warm && mine === "architect" && lv.strip) ? "" : "none";
      if (!warm && mine === "architect" && lv.strip){
        clear(UI.strip);
        r.deck.forEach(function(e, ix){
          var b = el("button","cardbtn");
          if (ix === slot) b.classList.add("active");
          if (r.proposed === ix) b.classList.add("proposed");
          if (e.submitted) b.classList.add("done");
          else if (e.reopened) b.classList.add("reopened");
          var img = document.createElement("img");
          img.src = thumbOf(e.design); img.alt = "";
          b.appendChild(img);
          var cn = el("div","cn");
          cn.appendChild(el("span","", String(ix+1)));
          cn.appendChild(el("span","", e.submitted ? "\u2713"
                            : e.reopened ? "\u21ba"
                            : (ix === slot ? "\u25cf" : "")));
          b.appendChild(cn);
          b.onclick = function(){ propose(ix); };
          UI.strip.appendChild(b);
        });
      }

      /* rail. During the warm-up both players get the Builder's rail, because
         both of them need to have handled a cube before the clock starts. */
      clear(UI.rail);
      if (mine === "builder" || warm){
        var canTurn = turnMatters(r);
        UI.toolBtns.turn.style.display = canTurn ? "" : "none";
        if (!canTurn && C.tool === "turn"){ C.tool = "place"; C.selected = -1;
          Object.keys(UI.toolBtns).forEach(function(k){
            UI.toolBtns[k].setAttribute("aria-pressed", String(k==="place")); }); }
        var act = el("div","actgroup");
        act.appendChild(UI.tools);
        act.appendChild(UI.swatches);
        UI.swatches.classList.toggle("idle", C.tool !== "place");
        UI.rail.appendChild(act);
        UI.rail.appendChild(UI.railNote);
        clear(UI.dots);
        if (lv.strip && !warm){
          r.deck.forEach(function(e, ix){
            var d = el("span","vtag", String(ix+1));
            d.style.padding = "1px 6px";
            if (ix === slot) d.style.borderColor = "var(--cyan)", d.style.color = "var(--cyan)";
            else if (e.submitted) d.style.color = "var(--green)";
            else if (e.reopened) d.style.color = "var(--amber)";
            UI.dots.appendChild(d);
          });
        }
        if (!warm && r.proposed !== null && r.proposed !== undefined && r.proposed !== slot){
          var bar = el("div","waiting");
          bar.style.borderStyle = "solid";
          bar.style.borderColor = "var(--amber)";
          bar.appendChild(el("span","", "Move to Design " + (r.proposed+1) + "?"));
          var yes = el("button","btn go","Go there");
          yes.onclick = function(){ acceptMove(); };
          var no = el("button","btn","Not yet");
          no.onclick = function(){
            SHARED.write(function(st){ st.round.proposed = null; });
            C.say("Told them not yet");
          };
          bar.appendChild(yes); bar.appendChild(no);
          UI.railMsg.textContent = "";
          clear(UI.railBar); UI.railBar.appendChild(bar);
        } else if (warm){
          clear(UI.railBar);
          UI.railMsg.textContent = "";
        } else {
          clear(UI.railBar);
          var e0 = r.deck[slot];
          UI.railMsg.textContent = e0.submitted
            ? "Design " + (slot+1) + " is submitted. Change anything and it needs submitting again."
            : (e0.reopened ? "Reopened \u2014 submit it again for it to count."
                           : "Design " + (slot+1) + " \u00b7 not submitted yet");
        }
        UI.submit.style.display = warm ? "none" : "";
        UI.submit.textContent = r.deck[slot].submitted ? "Submitted" : "Submit this build";
        UI.submit.disabled = r.deck[slot].submitted;
      } else {
        var note = el("div","railnote");
        var e1 = r.deck[slot];
        var msg = lv.strip
          ? "Your teammate is on Design " + (slot+1) + ". Tap a card to look ahead; the board "+
            "moves only when they agree."
          : "Describe it. They cannot see any of it.";
        if (r.proposed !== null && r.proposed !== undefined && r.proposed !== slot)
          msg = "Waiting for your teammate to agree to move to Design " + (r.proposed+1) + ".";
        note.appendChild(el("div","note", msg));
        var counts = el("div","kv","");
        var done = r.deck.filter(function(e){ return e.submitted; }).length;
        counts.textContent = done + " of " + r.deck.length + " submitted";
        counts.style.marginTop = "4px";
        note.appendChild(counts);
        UI.rail.appendChild(note);
      }

      if (mine === "builder" || warm) layoutPill();

      UI.endBtn.style.display = warm ? "none" : "";
      UI.clock.style.visibility = warm ? "hidden" : "";

      /* END wording once the only design is in */
      if (!warm && !lv.strip && r.deck[0].submitted){
        UI.endBtn.textContent = "Finished \u2014 see how you did";
        UI.endBtn.classList.remove("danger");
        UI.endBtn.classList.add("go");
      } else {
        UI.endBtn.textContent = "END";
        UI.endBtn.classList.add("danger");
        UI.endBtn.classList.remove("go");
      }
    }

    function propose(ix){
      var s = SHARED.read(), r = s.round; if (!r) return;
      C.previewSlot = ix;
      SHARED.write(function(st){
        st.round.deck[ix].architectOpened = true;
        st.round.proposed = (ix === st.round.activeSlot) ? null : ix;
      });
    }
    function acceptMove(){
      SHARED.write(function(st){
        var r = st.round, now = NOW();
        r.deck[r.activeSlot].activeMs += now - r.activeSince;
        r.activeSlot = r.proposed;
        r.activeSince = now;
        r.proposed = null;
        r.openNonce = (r.openNonce || 0) + 1;
      });
      C.selected = -1;
    }

    /* ---------- the clock ---------- */
    function tickClock(s){
      var r = s.round;
      if (!r || (s.phase !== "play")) return;
      /* held at zero until both players have finished or skipped their
         coachmarks: the round should not be timing while someone is reading */
      /* held at zero until gateCheck has seen both readers finish, so the
         first frame after the last Next does not flash the whole warm-up */
      var el0 = (coachHeld(r) || !r.coachDone) ? 0 : NOW() - r.startedAt;
      UI.clock.textContent = clock(el0);
      var tgt = r.targetMs;
      if (tgt){
        var f = Math.min(1, el0/tgt);
        UI.trackFill.style.width = (f*100) + "%";
        UI.trackMark.style.left = "100%";
        UI.trackMark.style.display = "";
        var over = el0 > tgt;
        UI.trackFill.classList.toggle("over", over);
        UI.clock.classList.toggle("over", over);
      } else {
        UI.trackFill.style.width = Math.min(100, (el0/600000)*100) + "%";
        UI.trackMark.style.display = "none";
        UI.clock.classList.remove("over");
      }
    }
    C.tickClock = tickClock;

    /* ==========================================================
       REVIEW
       ========================================================== */
    (function(){
      UI.revStrip = el("div","strip");
      UI.pReview.appendChild(UI.revStrip);
      UI.revBar = el("div","verdictbar");
      UI.pReview.appendChild(UI.revBar);

      var two = el("div","twoup");
      var a = el("div"); a.appendChild(el("h4","","Design"));
      UI.revDesignHost = el("div","mini"); a.appendChild(UI.revDesignHost);
      var b = el("div"); b.appendChild(el("h4","","Build"));
      UI.revBuildHost = el("div","mini"); b.appendChild(UI.revBuildHost);
      UI.revTip = el("div","tip","");
      b.appendChild(UI.revTip);          /* not inside .mini, which clips */
      UI.revCol = b;
      two.appendChild(a); two.appendChild(b);
      UI.pReview.appendChild(two);

      UI.revViews = el("div","row"); UI.revViews.style.padding = "0 8px 6px";
      UI.revViewBtns = [];
      for (var i=0;i<4;i++){
        (function(ix){
          var v = el("button","btn", "View "+(ix+1));
          v.style.padding = "4px 9px";
          v.onclick = function(){
            C.reviewView = ix;
            C.revHoverIx = -1;
            UI.revTip.classList.remove("on");
            UI.revViewBtns.forEach(function(x,k){ x.classList.toggle("go", k===ix); });
            if (UI.revD) UI.revD.stepTo(ix);
            if (UI.revB) UI.revB.stepTo(ix);
          };
          UI.revViews.appendChild(v); UI.revViewBtns.push(v);
        })(i);

      UI.revLegend = el("div","difflegend");
