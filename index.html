      UI.pReview.appendChild(UI.revHidden);

      var foot = el("div","pad");
      UI.revTotals = el("div","card");
      foot.appendChild(UI.revTotals);
      UI.revActions = el("div","card");
      foot.appendChild(UI.revActions);
      UI.pReview.appendChild(foot);
    })();

    function ensureReviewViewers(){
      var made = false;
      if (!UI.revD && UI.revDesignHost.clientWidth){ made = true;
        var c1 = document.createElement("canvas");
        UI.revDesignHost.appendChild(c1);
        UI.revD = makeViewer(c1, { plate:true }); UI.revD.resize();
      }
      if (!UI.revB && UI.revBuildHost.clientWidth){ made = true;
        var c2 = document.createElement("canvas");
        UI.revBuildHost.appendChild(c2);
        UI.revB = makeViewer(c2, { plate:true }); UI.revB.resize();
        wireReviewHover();
      }
      return made;
    }

    /* legend swatches drawn rather than coloured squares: the missing-cube chip
       has to be translucent itself or it says the wrong thing, and the wrong
       chip has to show pattern-plus-outline because that is what is on screen */
    function revChip(kind, label){
      var c = el("span","chip");
      var g = document.createElementNS(SVGNS,"svg");
      g.setAttribute("width","20"); g.setAttribute("height","20");
      g.setAttribute("viewBox","0 0 20 20");
      if (kind === "ghost")
        g.innerHTML = '<rect x="3" y="3" width="14" height="14" rx="1.5" fill="#8A9AAB" '+
          'fill-opacity="0.40" stroke="#8A9AAB" stroke-opacity="0.8" stroke-dasharray="2.5 2"/>';
      else
        g.innerHTML = '<defs><pattern id="zp'+C.slot+'" width="5" height="5" '+
          'patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
          '<rect width="2.4" height="5" fill="#0B1017"/></pattern></defs>'+
          '<rect x="3" y="3" width="14" height="14" rx="1.5" fill="#D55E00"/>'+
          '<rect x="3" y="3" width="14" height="14" rx="1.5" fill="url(#zp'+C.slot+')" opacity="0.62"/>'+
          '<rect x="3" y="3" width="14" height="14" rx="1.5" fill="none" stroke="#D6453F" '+
          'stroke-width="2"/>';
      c.appendChild(g);
      c.appendChild(document.createTextNode(label));
      return c;
    }

    /* hovering a flagged cube clears its stripes and says what is wrong with it.
       Wired once, on the review build canvas, when that viewer is created. */
    C.revHoverIx = -1;
    function wireReviewHover(){
      var cv = UI.revB && UI.revB.canvas; if (!cv || cv.dataset.hoverWired) return;
      cv.dataset.hoverWired = "1";
      cv.addEventListener("pointermove", function(ev){
        try {
          var df = C.revDiff, build = C.revBuild;
          if (!df || !build) return;
          var i = pickCube(UI.revB, ev, build);
          var flagged = i >= 0 && df.build[i];
          if (i !== C.revHoverIx){
            C.revHoverIx = flagged ? i : -1;
            paintAll();
          }
          if (!flagged){ UI.revTip.classList.remove("on"); return; }
          UI.revTip.textContent = revWhy(df.build[i], build[i]);
          var box = UI.revCol.getBoundingClientRect();
          UI.revTip.style.left = (ev.clientX - box.left) + "px";
          UI.revTip.style.top = (ev.clientY - box.top) + "px";
          UI.revTip.classList.add("on");
        } catch(e){ boom("review hover", e); }
      });
      cv.addEventListener("pointerleave", function(){
        UI.revTip.classList.remove("on");
        if (C.revHoverIx !== -1){ C.revHoverIx = -1; paintAll(); }
      });
    }
    /* recomputed whenever the camera has moved or the panel has been repainted */
    function noteHidden(){
      if (!UI.revB || !UI.revHidden) return;
      var list = C.revBuild || [], wrong = C.revHidWrong || [];
      var n = 0;
      for (var i=0;i<wrong.length;i++)
        if (list[wrong[i]] && hiddenFrom(UI.revB, list, wrong[i])) n++;
      UI.revHidden.textContent = n
        ? n + (n === 1 ? " wrong cube is" : " wrong cubes are") +
          " out of sight from this view \u2014 try another view."
        : "";
    }

    function revWhy(kind, q){
      if (kind === "extra") return "There is no cube here in the design.";
      if (kind === "color"){
        var want = revRightColor(q);
        return want ? "Wrong color \u2014 this one should be " + want + "."
                    : "Wrong color.";
      }
      return "Right cube, turned the wrong way up.";
    }
    function revRightColor(q){
      var s = SHARED.read(), r = reviewRound(s); if (!r) return null;
      var d = r.deck[C.reviewSlot].design;
      for (var k=0;k<d.cubes.length;k++){
        var c = d.cubes[k];
        if (c.x===q.x && c.y===q.y && c.z===q.z) return colInfo(c.c).name.toLowerCase();
      }
      return null;
    }

    function reviewRound(s){
      if (C.historyIx !== null && s.finished[C.historyIx]) return s.finished[C.historyIx];
      return s.round;
    }

    function paintReview(s){
      var r = reviewRound(s); if (!r) return;
      ensureReviewViewers();
      if (C.reviewSlot >= r.deck.length) C.reviewSlot = 0;
      var e = r.deck[C.reviewSlot], d = e.design;
      var verdict = e.submitted && e.build ? verdictOf(d, e.build) : "NOT SUBMITTED";
      /* "Opened, not sent" told a player nothing. Spelled out, and split from
         never-opened, which is a different thing entirely. */
      var shown = verdict !== "NOT SUBMITTED" ? verdict
                : e.architectOpened ? "OPENED, NOT SUBMITTED" : "NEVER OPENED";
      var why = verdict !== "NOT SUBMITTED" ? VERDICT_WHY[verdict]
              : e.architectOpened
                ? "The Architect opened this one but no build was submitted, so it was not compared."
                : "The Architect never opened this one.";
      var df = diffOf(d, e.build || []);

      clear(UI.revStrip);
      r.deck.forEach(function(en, ix){
        var b = el("button","cardbtn");
        if (ix === C.reviewSlot) b.classList.add("active");
        var img = document.createElement("img");
        img.src = thumbOf(en.design); img.alt = "";
        b.appendChild(img);
        var v = en.submitted && en.build ? verdictOf(en.design, en.build) : "NOT SUBMITTED";
        var cn = el("div","cn");
        cn.appendChild(el("span","", String(ix+1)));
        cn.appendChild(el("span","", v === "PERFECT" ? "\u2713" : v === "NOT SUBMITTED" ? "\u2014" : "\u2715"));
        if (v === "PERFECT") b.classList.add("done");
        b.appendChild(cn);
        b.onclick = function(){ C.reviewSlot = ix; C.revHoverIx = -1;
                                UI.revTip.classList.remove("on"); paintAll(); };
        UI.revStrip.appendChild(b);
      });

      clear(UI.revBar);
      UI.revBar.appendChild(el("b","", "Design " + (C.reviewSlot+1)));
      var tag = el("span","vtag " + verdictClass(verdict), shown);
      UI.revBar.appendChild(tag);
      UI.revBar.appendChild(el("span","note", why));

      /* One signal for a wrong cube, not three (brief 5.9). Zebra stripes on
         every face of any cube that does not match, whatever is wrong with it,
         plus a single red outline — one colour for everything, so nothing
         competes with the cube colors. The stripes clear on the hovered cube so
         its marks can be read, and the tooltip says what is actually wrong.
         The breakdown stays in words below and in the exported data. */
      var wrong = Object.keys(df.build);
      var flags = {}, styles = {};
      wrong.forEach(function(k){
        flags[k] = "extra";                       // one red for every kind
        if (Number(k) !== C.revHoverIx) styles[k] = "zebra";
      });
      C.revDiff = df; C.revBuild = e.build || [];

      if (UI.revD) UI.revD.paint(d.cubes, d.glyphs,
        { faceMode:d.faces, dim: d.glyphs !== "none" });
      if (UI.revB) UI.revB.paint(e.build || [], d.glyphs,
        { flags:flags, styles:styles, ghosts:df.ghosts, weight:3, ghostOpacity:0.40,
          faceMode:d.faces, dim: d.glyphs !== "none" });

      clear(UI.revLegend);
      if (e.submitted && e.build){
        var counts = el("span","words", diffWords(df) || "Everything matches.");
        UI.revLegend.appendChild(counts);
        UI.revLegend.appendChild(revChip("zebra","wrong"));
        /* a flat grey chip says the wrong thing about a translucent ghost */
        UI.revLegend.appendChild(revChip("ghost","missing"));
        if (wrong.length)
          UI.revLegend.appendChild(el("span","chip","hover a flagged cube to see why"));
      } else {
        UI.revLegend.appendChild(el("span","words",
          e.architectOpened ? "Opened, not submitted \u2014 nothing to compare."
                            : "Never opened."));
      }

      /* a wrong cube can be hidden behind a right one from this view. Which
         cubes those are depends on where the camera actually is, so the note is
         recomputed from the frame loop rather than here: pressing a view button
         starts a glide, and computing at paint time answered for the old camera
         and then never updated. */
      C.revHidWrong = wrong.map(Number);
      C.revHidDirty = true;

      /* totals */
      clear(UI.revTotals);
      var lvv = levelOf(r.levelId);
      var head = el("h3","", "Level " + lvv.n + " \u2014 " + lvv.name);
      UI.revTotals.appendChild(head);
      var sub = el("p","note", "Ran " + clock(r.elapsedMs) +
        (r.targetMs ? " against a " + Math.round(r.targetMs/60000) + " minute target" : ", unlimited") +
        " \u00b7 ended by " + (r.endedBy === "host" ? r.names.host : r.names.guest) +
        " \u00b7 " + r.names.architect + " described, " + r.names.builder + " built");
      UI.revTotals.appendChild(sub);
      var subm = 0, perf = 0, opened = 0, never = 0;
      r.deck.forEach(function(en){
        var v = en.submitted && en.build ? verdictOf(en.design, en.build) : "NOT SUBMITTED";
        if (v === "NOT SUBMITTED"){
          if (en.architectOpened) opened++; else never++;
        } else { subm++; if (v === "PERFECT") perf++; }
      });
      var hl = el("div","headline");
      var big = el("div","big" + (perf ? "" : " zero"), String(perf));
      var lab = el("div","biglab", perf === 1 ? "perfect build" : "perfect builds");
      lab.appendChild(el("span","", "out of " + r.deck.length +
        (r.deck.length === 1 ? " design" : " designs") + " dealt"));
      hl.appendChild(big); hl.appendChild(lab);
      UI.revTotals.appendChild(hl);

      UI.revTotals.appendChild(el("div","secondline",
        subm + (subm === 1 ? " build submitted" : " builds submitted")));

      /* facilitator diagnostics, not player scores: one quiet line */
      if (opened || never){
        var bits = [];
        if (opened) bits.push(opened + " opened, not submitted");
        if (never) bits.push(never + " never opened");
        UI.revTotals.appendChild(el("div","quietline", bits.join(" \u00b7 ")));
      }

      /* actions */
      clear(UI.revActions);
      if (C.historyIx !== null){
        var back = el("button","btn","Back to the lobby");
        back.onclick = function(){ C.historyIx = null; paintAll(); };
        UI.revActions.appendChild(back);
        return;
      }
      var rowA = el("div","row");
      var cp = el("button","btn","Copy round data");
      cp.onclick = function(){
        copyText(JSON.stringify(roundData(SHARED.read(), r), null, 2), function(){
          C.say("Round data copied");
        });
      };
      rowA.appendChild(cp);
      UI.revActions.appendChild(rowA);

      var amHost = C.kind === "host";
      var pend = s.pending;
      var rowB = el("div","row"); rowB.style.marginTop = "8px";
      if (amHost){
        if (pend){
          var w = el("div","waiting");
          w.appendChild(el("span","","Waiting for teammate to confirm"));
          var dd = el("span","dots"); dd.innerHTML = "<i></i><i></i><i></i>"; w.appendChild(dd);
          rowB.appendChild(w);
        } else {
          if (lvv.id === "L1" && untriedRound1(s).length){
            var ta = el("button","btn go","Try another design");
            ta.onclick = function(){
              SHARED.write(function(st){ st.pending = { kind:"another", at:NOW() }; });
            };
            rowB.appendChild(ta);
          }
          var sa = el("button","btn go","Set up another round");
          sa.onclick = function(){
            SHARED.write(function(st){ st.pending = { kind:"lobby", at:NOW() }; });
          };
          rowB.appendChild(sa);
        }
      } else {
        rowB.appendChild(el("div","note",
          "Your teammate will pick what happens next. Take your time here."));
      }
      UI.revActions.appendChild(rowB);
    }

    function checkPending(s){
      if (C.kind !== "guest" || !s.pending) { C.sawPending = C.sawPending || null; return; }
      var qsig = JSON.stringify(s.pending);        // by value, as above
      if (C.sawPending === qsig) return;
      C.sawPending = qsig;
      var another = s.pending.kind === "another";
      ask(another ? "One more design?" : "Set up another round?",
        another
          ? "Your teammate would like to try another design while the room finishes. "+
            "Same roles, one more build."
          : "Your teammate is ready to set up another round. You will both go back to the lobby.",
        another ? "Try another" : "Back to the lobby",
        function(){
          if (another) startAnother(); else backToLobby();
        },
        "Cancel",
        function(){ SHARED.write(function(st){ st.pending = null; }); });
    }

    /* ==========================================================
       PAINT DISPATCH
       ========================================================== */
    /* A round now starts because the OTHER machine wrote it, so the reset of
       this window's private state cannot be a side effect of the press that
       started it — the presser is only one of the two players. Each window
       notices the round id changed and clears its own. Level 2 replayed by the
       same team deals the same design ids, so a stale build really would
       carry over. */
    function syncRoundLocal(s){
      var rid = s.round ? s.round.id : "none";
      if (C.roundKey === rid) return;
      C.roundKey = rid;
      C.localBuild = {}; C.previewSlot = null; C.selected = -1;
      C.reviewSlot = 0; C.warmCubes = []; C.sawNonce = null;
      C.sawProposal = null; C.sawPending = null; C.flushedFor = null;
    }

    function paintAll(){
      var s = SHARED.read();
      syncRoundLocal(s);
      var screen;
      if (C.historyIx !== null) screen = "review";
      else if (!C.kind) screen = "landing";
      else screen = s.phase;

      UI.pLanding.classList.toggle("on", screen === "landing");
      UI.pLobby.classList.toggle("on", screen === "lobby");
      UI.pPlay.classList.toggle("on", screen === "play" || screen === "warmup");
      UI.pReview.classList.toggle("on", screen === "review");

      if (screen === "warmup" || screen === "play") ensureCanvas(UI.stageHost);

      UI.whoName.textContent = C.name || ("Player " + C.slot);
      var role = C.kind ? myRole(s) : null;
      UI.whoRole.textContent = C.kind
        ? (s.phase === "lobby" || s.phase === "landing" ? (C.kind === "host" ? "host" : "joined")
                                                        : role)
        : "not joined";
      UI.whoRole.className = "role" + (C.kind && role && s.phase !== "lobby" ? " " + role : "");
      /* a facilitator crossing the room needs to see where a pair is at a
         glance, and the level is the only thing that says it */
      var bits = [];
      if (screen === "play" || screen === "warmup" || screen === "review"){
        var lvr = (C.historyIx !== null ? reviewRound(s) : s.round);
        if (lvr) bits.push("Level " + levelOf(lvr.levelId).n);
      }
      if (s.team){ bits.push(s.team.code); bits.push(s.team.session); }
      UI.whoTeam.textContent = bits.join(" \u00b7 ");

      if (screen === "lobby"){ paintLobby(s); checkProposal(s); }
      if (screen === "warmup"){ coachSync(s); paintPlay(s); maybeOnboard(s); }
      else if (screen === "play"){ coachSync(s); paintPlay(s); tickClock(s); maybeOnboard(s); }
      else { UI.coachBox.classList.remove("on"); UI.coachWait.classList.remove("on"); }
      if (screen === "review"){ paintReview(s); checkPending(s); }

      if (s.lobby && s.lobby.rejected && C.kind === "host"){
        SHARED.write(function(st){ st.lobby.rejected = false; });
        C.say("Your teammate cancelled the round settings");
      }
    }
    C.paintAll = paintAll;

    /* ---------- coachmarks ----------
       Replaces the round-start instruction block, which was a modal and so
       blocked the very controls it described. Presented-ness is per player and
       keyed by role and feature, so it survives a role swap and does not care
       which level the player is in. */
    C.coachSeen = {};

    function coachSeq(s, warm){
      var r = s.round; if (!r || !C.kind) return [];
      var mine = myRole(s); if (!mine) return [];
      return coachSeqFor(mine, levelOf(r.levelId), C.coachSeen, warm);
    }

    function coachRelease(){
      var s = SHARED.read(), r = s.round;
      if (!r || !r.coach || r.coach[C.kind]) return;
      /* my own flag only; gateCheck() starts the clock when the last reader
         is done, so neither the round clock nor the per-design time carries
         the reading in it */
      SHARED.write(function(st){
        var rr = st.round; if (!rr || !rr.coach) return;
        rr.coach[C.kind] = true;
      });
    }

    function coachAdvance(all){
      var q = C.coachQueue || [];
      if (all) { for (var i=C.coachIx;i<q.length;i++) C.coachSeen[q[i]] = true;
                 C.coachIx = q.length; }
      else     { if (q[C.coachIx]) C.coachSeen[q[C.coachIx]] = true; C.coachIx++; }
      if (C.coachIx >= q.length && SHARED.read().phase === "play") coachRelease();
      paintAll();
    }
    UI.coachNext.onclick = function(){ coachAdvance(false); };
    UI.coachSkip.onclick = function(){ coachAdvance(true); };

    function coachOpen(){
      return (C.coachQueue || []).length > C.coachIx;
    }
    function coachCurrent(){
      var id = (C.coachQueue || [])[C.coachIx];
      for (var i=0;i<COACH.length;i++) if (COACH[i].id === id) return COACH[i];
      return null;
    }
    C.coachOpen = coachOpen;

    /* Building the queue is separated from painting it because paintPlay asks
       whether coachmarks are open — the warm-up message waits on that — and it
       runs first. With both in one function the queue did not exist yet and the
       message dropped in immediately. */
    function coachSync(s){
      var r = s.round;
      if (!r || !C.kind){ C.coachQueue = []; C.coachIx = 0; C.coachKey = null; return; }
      var warm = s.phase === "warmup";
      var key = r.id + (warm ? ":warm" : ":play");
      if (C.coachKey !== key){
        C.coachKey = key;
        C.coachQueue = coachSeq(s, warm).map(function(b){ return b.id; });
        C.coachIx = 0;
        /* nothing owed: do not hold the clock waiting for a box that will
           never appear */
        if (!warm && !C.coachQueue.length) coachRelease();
      }
    }
    function maybeOnboard(s){
      if (!s.round || !C.kind){ UI.coachBox.classList.remove("on");
                                UI.coachWait.classList.remove("on"); return; }
      paintCoach(s);
    }
    C.coachSync = coachSync;

    function paintCoach(s){
      var r = s.round;
      var q = C.coachQueue || [];
      var showWait = false;
      if (!coachOpen()){
        UI.coachBox.classList.remove("on");
        UI.coachTail.classList.remove("on");
        /* only in the round: the warm-up has its own Ready gate and says so */
        showWait = s.phase === "play" && r && r.coach && r.coach[C.kind] &&
                   !(r.coach.host && r.coach.guest);
        UI.coachWait.classList.toggle("on", !!showWait);
        return;
      }
      UI.coachWait.classList.remove("on");

      var bx = coachCurrent();
      if (!bx){ UI.coachBox.classList.remove("on");
                UI.coachTail.classList.remove("on"); return; }

      UI.coachHead.textContent = bx.head;
      UI.coachBody.textContent = coachBody(bx, turnMatters(r));
      UI.coachCount.textContent = (C.coachIx+1) + " of " + q.length;
      var last = (C.coachIx === q.length - 1);
      /* the last box has nothing left to skip, so it just closes */
      UI.coachNext.textContent = last ? "Close" : "Next";
      UI.coachSkip.style.display = last ? "none" : "";
      UI.coachBox.setAttribute("data-place", bx.place);
      UI.coachBox.classList.add("on");
      positionCoach(bx);
    }

    var TAILW = 20, OVERLAP = 1;     /* overlap = the box's own border width */

    function positionCoach(bx){
      var host = UI[bx.host];
      var box = UI.coachBox, tail = UI.coachTail, path = UI.coachTailPath;
      if (!host || !UI.mount) { box.classList.remove("on");
                                tail.classList.remove("on"); return; }
      var target = host;
      /* a row of cards or numbers: aim at one of them, not the middle of the row */
      if (bx.anchorFirst && host.firstElementChild) target = host.firstElementChild;
      if (bx.nth){
        var kids = host.children;
        if (kids.length) target = kids[Math.min(bx.nth, kids.length) - 1];
      }
      var pr = UI.mount.getBoundingClientRect();
      var tr = target.getBoundingClientRect();
      if (!tr.width || !tr.height){ box.classList.remove("on");
                                    tail.classList.remove("on"); return; }
      var bw = box.offsetWidth, bh = box.offsetHeight;
      var T = bx.tail || 26, EDGE = 8;

      /* the point the tail must reach: the near edge of most targets, a point
         inside one that fills the panel */
      var tipX, tipY;
      if (bx.inside){
        tipX = tr.left - pr.left + tr.width  * bx.inside[0];
        tipY = tr.top  - pr.top  + tr.height * bx.inside[1];
      } else if (bx.place === "left"){
        tipX = tr.left - pr.left;
        tipY = tr.top - pr.top + tr.height/2;
      } else {
        tipX = tr.left - pr.left + tr.width/2;
        tipY = tr.top - pr.top;                 /* the top edge, not the middle */
      }

      var x, y;
      if (bx.place === "left")    { x = tipX - T - bw;  y = tipY - bh/2; }
      /* up and to the left, well clear, so the box never sits on the design it
         is talking about. The tail runs diagonally back down to the target. */
      else if (bx.place === "nw") { x = tipX - bw - T;  y = tipY - bh - T; }
      else                        { x = tipX - bw/2;    y = tipY - T - bh; }
      x = Math.max(EDGE, Math.min(x, pr.width - bw - EDGE));
      y = Math.max(EDGE, Math.min(y, pr.height - bh - EDGE));
      box.style.left = Math.round(x) + "px";
      box.style.top  = Math.round(y) + "px";

      drawTail(pr, x, y, bw, bh, tipX, tipY);
    }

    /* One continuous outline for box and tail together.
       The shape is a rounded rectangle traced clockwise, with a spur inserted
       partway along whichever edge faces the target: base on the edge, apex on
       the target. Because it is one path with one stroke, there is no rectangle
       perimeter cutting across the tail and no seam where they meet — which is
       what a rect-plus-triangle can never quite manage, since the box's own
       border always runs across the triangle's base. */
    function drawTail(pr, x, y, bw, bh, tipX, tipY){
      var svg = UI.coachTail, path = UI.coachTailPath;
      var R = 4, W = TAILW;
      var cx = x + bw/2, cy = y + bh/2;
      var dx = tipX - cx, dy = tipY - cy;

      /* which edge does the line to the target leave through */
      var edge = null;
      if (dx || dy){
        var kx = dx ? (bw/2)/Math.abs(dx) : Infinity;
        var ky = dy ? (bh/2)/Math.abs(dy) : Infinity;
        if (kx < ky) edge = dx > 0 ? "right" : "left";
        else         edge = dy > 0 ? "bottom" : "top";
      }
      /* target inside or almost inside the box: no spur, just the rectangle */
      var inside = tipX > x - 6 && tipX < x + bw + 6 &&
                   tipY > y - 6 && tipY < y + bh + 6;
      if (inside) edge = null;

      var L = x, T = y, Rr = x + bw, B = y + bh;
      var half = W/2, PAD = R + 3;
      var d = [];
      function seg(e, from, to){
        /* the straight run of one edge, with the spur folded in when it belongs
           to this edge. `from` and `to` are in traversal order. */
        if (edge !== e){ d.push("L" + to[0].toFixed(1) + "," + to[1].toFixed(1)); return; }
        var horiz = (e === "top" || e === "bottom");
        var a = horiz ? from[0] : from[1];
        var b = horiz ? to[0]   : to[1];
        var lo = Math.min(a,b) + PAD, hi = Math.max(a,b) - PAD;
        if (hi - lo < W + 2){                       /* no room for a spur here */
          d.push("L" + to[0].toFixed(1) + "," + to[1].toFixed(1)); return;
        }
        var mid = Math.max(lo + half, Math.min(horiz ? tipX : tipY, hi - half));
        var p1 = (a < b) ? mid - half : mid + half;
        var p2 = (a < b) ? mid + half : mid - half;
        var fixed = horiz ? from[1] : from[0];
        var q1 = horiz ? [p1, fixed] : [fixed, p1];
        var q2 = horiz ? [p2, fixed] : [fixed, p2];
        d.push("L" + q1[0].toFixed(1) + "," + q1[1].toFixed(1));
        d.push("L" + tipX.toFixed(1) + "," + tipY.toFixed(1));
        d.push("L" + q2[0].toFixed(1) + "," + q2[1].toFixed(1));
        d.push("L" + to[0].toFixed(1) + "," + to[1].toFixed(1));
      }
      function arc(to){
        d.push("A" + R + "," + R + " 0 0 1 " + to[0].toFixed(1) + "," + to[1].toFixed(1));
      }
      d.push("M" + (L+R).toFixed(1) + "," + T.toFixed(1));
      seg("top",    [L+R, T], [Rr-R, T]);  arc([Rr, T+R]);
      seg("right",  [Rr, T+R], [Rr, B-R]); arc([Rr-R, B]);
      seg("bottom", [Rr-R, B], [L+R, B]);  arc([L, B-R]);
      seg("left",   [L, B-R], [L, T+R]);   arc([L+R, T]);
      d.push("Z");

      path.setAttribute("d", d.join(" "));
      svg.setAttribute("width", Math.round(pr.width));
      svg.setAttribute("height", Math.round(pr.height));
      svg.setAttribute("viewBox", "0 0 " + Math.round(pr.width) + " " +
                                           Math.round(pr.height));
      svg.classList.add("on");
    }

    /* paintAll runs from the state subscription, so a throw here used to
       propagate out of every SHARED.write and abandon the caller half-done —
       which is how startAnother's reset of localBuild never ran. */
    SHARED.subscribe(function(){
      try { paintAll(); } catch(e){ boom("paintAll/" + (C.kind||C.slot), e); }
    });
    CLIENTS.push(C);
    C.UI = UI;
    C.ensureStage = ensureStage;
    /* ribbons are projected, so they have to be redrawn while the camera moves
       between views and while a cube is turning. Redrawing every frame would
       rebuild the paths under the pointer and kill hover, so it is gated. */
    var lastOverW = -1, lastRevCam = "", lastDial = -1, lastCoachSig = "";
    TICKERS.push(function(dt){
      stepTurn(dt);
      /* the hidden-cube note follows the camera */
      if (UI.revB && UI.pReview.classList.contains("on")){
        var p = UI.revB.cam.position;
        var sig = p.x.toFixed(2) + "," + p.y.toFixed(2) + "," + p.z.toFixed(2);
        if (C.revHidDirty || sig !== lastRevCam){
          lastRevCam = sig; C.revHidDirty = false;
          try { noteHidden(); } catch(e){ boom("noteHidden", e); }
        }
      }
      var V = UI.stage;
      if (!V || !UI.stageCanvas) return true;
      var w = UI.stageCanvas.clientWidth;
      /* 84px against a 545px-tall stage is the proportion that reads correctly,
         so hold that ratio, with a floor so it never becomes unclickable and a
         ceiling so it never dominates */
      if (UI.dial){
        var h = UI.stageCanvas.clientHeight;
        var d = Math.max(84, Math.min(150, Math.round(Math.min(w, h) * 0.155)));
        if (d !== lastDial){ lastDial = d; UI.dial.style.setProperty("--d", d + "px"); }
      }
      if (V.glide || turnAnim || w !== lastOverW){ lastOverW = w; drawArms(); }

      /* The box is placed from measured rectangles, and on the first paint of a
         screen those rectangles are not final: the deck strip grows once its
         card thumbnails exist, which moves its top edge up after the box has
         already been positioned against the shorter version. Watch what the box
         points at and re-place it when it moves — which also covers the layout
         toggle and a window resize. */
      if (coachOpen()){
        var cbx = coachCurrent();
        var host = cbx && UI[cbx.host];
        if (host){
          var hr = host.getBoundingClientRect();
          var sig = [cbx.id, Math.round(hr.left), Math.round(hr.top),
                     Math.round(hr.width), Math.round(hr.height),
                     UI.coachBox.offsetHeight, host.children.length].join(",");
          if (sig !== lastCoachSig){
            lastCoachSig = sig;
            try { positionCoach(cbx); } catch(e){ boom("coach reposition", e); }
          }
        }
      }
      return true;
    });

    C.setView = setView;
    C.previewSlot = null;
    C.ensureReviewViewers = ensureReviewViewers;
    return C;
  }

  /* ==========================================================
     16. ROUND LIFECYCLE
     ========================================================== */
  function untriedRound1(s){
    var used = (s.team && s.team.usedRound1) || [];
    return familiesInTier("1").filter(function(f){ return used.indexOf(f.id) < 0; });
  }
  function newRound(s, levelId, targetMin, hostRole){
    var lv = levelOf(levelId);
    var used = (s.team.usedRound1 || []);
    /* count the rounds this team has been dealt, so a replay is a fresh draw */
    s.team.dealt = (s.team.dealt || 0) + 1;
    var designs = deal(lv, s.team.code, lv.id === "L1" ? used : null, s.team.dealt);
    /* The warm-up exists because marks and the build controls arrive together
       and frustration is the primary risk (brief 5.5). Its condition is "this
       team has not handled a marked cube before", not "this is Level 3" — a
       team replaying the level has already done it, and sitting them through it
       again is the round-start modal problem in another costume. */
    var firstWithMarks = lv.glyphs !== "none" &&
      !(s.finished || []).some(function(f){
        return f.settings && f.settings.glyphs && f.settings.glyphs !== "none";
      });
    var guestRole = hostRole === "architect" ? "builder" : "architect";
    var names = {
      host: s.team.host.name,
      guest: s.team.guest ? s.team.guest.name : "\u2014"
    };
    names.architect = hostRole === "architect" ? names.host : names.guest;
    names.builder   = hostRole === "builder"   ? names.host : names.guest;
    var now = NOW();
    var r = {
      id: "r-" + now.toString(36),
      levelId: lv.id,
      settings: { comp:lv.comp, glyphs:lv.glyphs, faces:lv.faces, rule:lv.rule,
                  strip:lv.strip, warmup: lv.warmup && firstWithMarks,
                  dimMarks:lv.dimMarks,
                  targetMin: lv.targetLocked ? null : targetMin,
                  deckSize: designs.length, ordering:"fixed" },
      targetMs: (lv.targetLocked || targetMin === null) ? null : targetMin*60000,
      roles: { host:hostRole, guest:guestRole },
      names: names,
      startedAt: now, activeSince: now, elapsedMs: 0,
      endedBy: null, endedAtMs: null, endedAt: null,
      activeSlot: 0, proposed: null, openNonce: 1,
      coach: { host:false, guest:false }, coachDone:false,
      deck: designs.map(function(d, ix){
        return { slot:ix, design:d, build:null, partial:null,
                 submitted:false, reopened:false, submissions:0, deletions:0,
                 activeMs:0, firstSubmitMs:null, architectOpened:false };
      })
    };
    /* the deck is meant to be uniform in kind (brief 5.3), and turnMatters
       reads the round's settings rather than the designs. If those two ever
       disagree the Builder gets a dead TURN button, or none when they need
       one. Fail here rather than in play. */
    var odd = designs.filter(function(d){
      return d.glyphs !== r.settings.glyphs || d.faces !== r.settings.faces ||
             d.rule !== r.settings.rule;
    });
    if (odd.length) throw new Error("deck disagrees with round settings: " +
      odd.map(function(d){ return d.name + " (" + d.glyphs + "/" + d.faces + ")"; }).join(", "));
    return r;
  }
  function startRound(){
    /* the confirmation can be pressed twice, or arrive after the teammate has
       cancelled: there may be nothing left to start */
    var p0 = SHARED.read().lobby;
    if (!p0 || !p0.proposal) return;
    SHARED.write(function(s){
      var p = s.lobby && s.lobby.proposal; if (!p) return;
      var r = newRound(s, p.levelId, p.targetMin, p.hostRole);
      if (levelOf(p.levelId).id === "L1"){
        s.team.usedRound1 = (s.team.usedRound1 || []).concat([r.deck[0].design.family]);
      }
      s.round = r;
      s.lobby.locked = false; s.lobby.proposal = null;
      s.pending = null;
      if (r.settings.warmup){
        s.warmup = { host:false, guest:false };
        s.phase = "warmup";
      } else {
        s.warmup = null;
        s.phase = "play";
      }
    });
    CLIENTS.forEach(function(c){ c.localBuild = {}; c.previewSlot = null; c.selected = -1; });
  }
  function startAnother(){
    if (!SHARED.read().round) return;
    publishRound();
    SHARED.write(function(s){
      if (!s.round) return;
      archive(s);
      var last = s.finished[s.finished.length-1];
      var r = newRound(s, "L1", null, last.roles.host);
      s.team.usedRound1 = (s.team.usedRound1 || []).concat([r.deck[0].design.family]);
      s.round = r; s.pending = null; s.phase = "play";
    });
    CLIENTS.forEach(function(c){
      c.localBuild = {}; c.previewSlot = null; c.selected = -1; c.reviewSlot = 0;
      c.warmCubes = []; c.sawNonce = null; c.historyIx = null;
    });
  }
  function backToLobby(){
    publishRound();
    SHARED.write(function(s){
      archive(s);
      s.round = null; s.pending = null; s.phase = "lobby";
      var last = s.finished[s.finished.length-1];
      var nextLevel = last ? nextLevelAfter(last.levelId) : "L1";
      var lv = levelOf(nextLevel);
      var hostRole = last ? last.roles.host : "architect";
      if (lv.id === "L3" && last && last.levelId !== "L3")
        hostRole = hostRole === "architect" ? "builder" : "architect";
      s.lobby = { levelId:nextLevel, targetMin: lv.targetLocked ? null : lv.target,
                  hostRole:hostRole, locked:false, proposal:null, rejected:false };
    });
    CLIENTS.forEach(function(c){
      c.localBuild = {}; c.previewSlot = null; c.selected = -1;
      c.reviewSlot = 0; c.sawProposal = null; c.sawPending = null;
    });
  }
  function nextLevelAfter(id){
    if (id === "L1") return "L2";
    if (id === "L2") return "L3";
    return "L3";
  }
  function archive(s){
    if (!s.round) return;
    s.finished = s.finished.concat([s.round]);
  }
  function endRound(who){
    SHARED.write(function(s){
      var r = s.round; if (!r) return;
      r.endedBy = who;
      var now = NOW();
      r.deck[r.activeSlot].activeMs += now - r.activeSince;
      r.activeSince = now;
      r.elapsedMs = now - r.startedAt;
      r.endedAtMs = r.elapsedMs;
      r.endedAt = now;
      s.phase = "review";
      s.pending = null;
    });
    publishRound();
  }
  // the Builder's unsent work reaches shared state only here, at END
  function flushPartials(C, s){
    var r = s.round; if (!r) return;
    if (r.roles[C.kind] !== "builder") return;
    if (C.flushedFor === r.id) return;
    C.flushedFor = r.id;
    var any = false, snap = {};
    r.deck.forEach(function(e, ix){
      var list = C.localBuild[e.design.id];
      if (list && list.length && !e.submitted){ snap[ix] = cloneCubes(list); any = true; }
    });
    if (!any) return;
    SHARED.write(function(st){
      Object.keys(snap).forEach(function(k){ st.round.deck[k].partial = snap[k]; });
    });
  }

  /* ---- what a round records, brief 3.4 ---- */
  function roundData(s, r){
    return {
      app:"relay", build:VERSION, exportedAt:new Date().toISOString(),
      session: s.team ? s.team.session : null,
      team: s.team ? { id:s.team.id, code:s.team.code,
                       players:{ host:s.team.host.name,
                                 guest:s.team.guest ? s.team.guest.name : null } } : null,
      round: {
        id:r.id, levelId:r.levelId, settings:r.settings,
        targetMs:r.targetMs, elapsedMs:r.elapsedMs,
        endedBy:r.endedBy, endedAtElapsedMs:r.endedAtMs,
        roles:r.roles
      },
      designs: r.deck.map(function(e){
        var v = e.submitted && e.build ? verdictOf(e.design, e.build) : "NOT SUBMITTED";
        return {
          slot: e.slot + 1,
          designId: e.design.id, family: e.design.family, tier: e.design.tier,
          cubes: e.design.cubes.length,
          verdict: v,
          activeMs: e.activeMs,
          firstSubmitElapsedMs: e.firstSubmitMs,
          submissions: e.submissions,
          deletions: e.deletions,
          architectOpened: e.architectOpened,
          reopened: e.reopened,
          build: e.build ? e.build.map(packCube) : null,
          partial: e.partial ? e.partial.map(packCube) : null
        };
      }),
      totals: totalsOf(r)
    };
  }
  function packCube(q){ return [q.x,q.y,q.z,q.c,q.o]; }
  /* The round, written where it can be read afterwards. Called at END so it
     survives a closed tab, and again on the way out of review, by when the
     Builder's unsent partials have been flushed. Same key both times, so the
     second write simply replaces the first with the more complete version.
     The Copy round data button still works and is still worth using. */
  function publishRound(){
    try {
      var s = SHARED.read(), r = s.round;
      if (!r || !s.team) return;
      SHARED.saveRound(roundData(s, r));
    } catch(e){ boom("publishRound", e); }
  }
  function totalsOf(r){
    var t = { submitted:0, correct:0, openedNotSubmitted:0, neverOpened:0 };
    r.deck.forEach(function(e){
      var v = e.submitted && e.build ? verdictOf(e.design, e.build) : "NOT SUBMITTED";
      if (v === "NOT SUBMITTED"){
        if (e.architectOpened) t.openedNotSubmitted++; else t.neverOpened++;
      } else {
        t.submitted++;
        if (v === "PERFECT") t.correct++;
      }
    });
    return t;
  }

  /* ==========================================================
     17. MOUNT, KEYBOARD, LOOP
     ========================================================== */
  /* ONE PLAYER PER WINDOW is the real thing, and it is now the default: a
     player who can see a second panel can see half of what they are meant to
     be describing. The two-panel rig is still here for testing the handshake
     in one window — add ?harness=1 to the address. */
  var TWOUP = /[?&]harness=1/.test(location.search);
  var harness = document.getElementById("harness");
  var mountA = el("section","player");
  harness.appendChild(mountA);
  var CA = makeClient("A", mountA), CB = null;
  if (TWOUP){
    var mountB = el("section","player");
    harness.appendChild(mountB);
    CB = makeClient("B", mountB);
  } else {
    var laybar = document.getElementById("lay");
    if (laybar) laybar.style.display = "none";
  }
  focused = CA;

  /* Text size. Browser zoom scales the whole layout, including the 3D stage
     and every container, so it does not do what "make the words bigger" means
     here. This sets one number that every declared size is a multiple of, on
     the players' panels only — the header keeps the fixed height the layout
     assumes. It starts at 1, which is exactly the size everything was
     designed at, so nothing moves unless someone asks it to. */
  (function(){
    var STEPS = [1, 1.15, 1.3, 1.5], ix = 0;
    try {
      var saved = parseFloat(localStorage.getItem("relay.textsize"));
      var at = STEPS.indexOf(saved);
      if (at >= 0) ix = at;
    } catch(e){}
    function apply(){
      harness.style.setProperty("--ts", String(STEPS[ix]));
      try { localStorage.setItem("relay.textsize", String(STEPS[ix])); } catch(e){}
      /* the stage shares the space with the text, so it has a new size now */
      VIEWERS.forEach(function(V){ V.lastW = -1; V.lastH = -1; });
      CLIENTS.forEach(function(C){
        try { C.paintAll(); } catch(e){ boom("text size/" + (C.kind||C.slot), e); }
      });
    }
    var up = document.getElementById("tsup"), down = document.getElementById("tsdown");
    if (up) up.onclick = function(){ if (ix < STEPS.length-1){ ix++; apply(); } };
    if (down) down.onclick = function(){ if (ix > 0){ ix--; apply(); } };
    apply();
  })();

  window.addEventListener("keydown", function(ev){
    if (/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
    var C = focused; if (!C || !C.kind) return;
    var s = SHARED.read();
    if (s.phase !== "play" && s.phase !== "warmup") return;
    var k = ev.key, lk = k.toLowerCase();
    if (lk >= "1" && lk <= "4"){ C.setView(Number(lk)-1); ev.preventDefault(); return; }
    var amBuilder = s.phase === "warmup" ? true : (s.round && C.myRole(s) === "builder");
    if (!amBuilder) return;
    if (k === "ArrowLeft"){  C.nudge("sl"); ev.preventDefault(); return; }
    if (k === "ArrowRight"){ C.nudge("sr"); ev.preventDefault(); return; }
    if (k === "ArrowDown"){  C.nudge("dn"); ev.preventDefault(); return; }
    if (k === "ArrowUp"){    C.nudge("up"); ev.preventDefault(); return; }
  });

  window.addEventListener("resize", function(){
    VIEWERS.forEach(function(V){ V.resize(); });
  });

  /* layout toggle. Two players side by side is right for testing the handshake
     and wrong for judging layout: every "too small" in the Session 3 review was
     made in a half-width panel. Viewers resize themselves in the frame loop. */
  (function(){
    var bar = document.getElementById("lay");
    bar.addEventListener("click", function(ev){
      var b = ev.target.closest("button[data-lay]"); if (!b) return;
      harness.setAttribute("data-lay", b.getAttribute("data-lay"));
      /* resize() early-returns when the measured size is unchanged, and a panel
         that was display:none measures zero. Drop the cached size so the next
         frame recomputes the aspect instead of stretching the old one. */
      VIEWERS.forEach(function(V){ V.lastW = -1; V.lastH = -1; });
      bar.querySelectorAll("button").forEach(function(x){
        var on = x === b;
        x.classList.toggle("on", on);
        x.setAttribute("aria-pressed", String(on));
      });
    });
  })();

  /* Gates that wait for BOTH players. Each player writes only their own flag,
     so the question "are we both ready" can only be answered once both writes
     have landed. Run from the frame loop rather than the subscription, so a
     write here cannot re-enter the paint that triggered it. Both players may
     notice at the same moment and both write the same answer; that converges. */
  function gateCheck(s){
    if (!SHARED.attached() || !s.round) return;
    if (s.phase === "warmup" && s.warmup && s.warmup.host && s.warmup.guest){
      SHARED.write(function(st){
        if (st.phase !== "warmup" || !st.round) return;
        st.phase = "play";
        st.round.startedAt = NOW();
        st.round.activeSince = st.round.startedAt;
        st.round.openNonce = (st.round.openNonce || 0) + 1;
      });
      return;
    }
    if (s.phase === "play" && !s.round.coachDone &&
        s.round.coach && s.round.coach.host && s.round.coach.guest){
      SHARED.write(function(st){
        var rr = st.round; if (!rr || rr.coachDone) return;
        rr.coachDone = true;
        rr.startedAt = NOW();
        rr.activeSince = rr.startedAt;
      });
    }
  }

  var last = performance.now();
  function frame(now){
    try {
      var dt = Math.min((now-last)/1000, 0.05); last = now;
      var s = SHARED.read();
      try { gateCheck(s); } catch(e){ boom("gateCheck", e); }
      s = SHARED.read();
      CLIENTS.forEach(function(C){
        try {
          var fresh = false;
          if (C.ensureStage){ C.ensureStage(); if (C.stageIsNew){ C.stageIsNew = false; fresh = true; } }
          if (C.ensureReviewViewers && C.ensureReviewViewers()) fresh = true;
          if (fresh) C.paintAll();
          if (s.phase === "play" && C.kind) C.tickClock(s);
          if (s.phase === "review" && C.kind) flushPartials(C, s);
        } catch(e){ boom("frame/client " + (C.kind||C.slot), e); }
      });
      /* animations that are not the camera register here: a ticker returns false
         when it is done and is dropped. The turn animation (5.7) uses this. */
      for (var ti = TICKERS.length - 1; ti >= 0; ti--){
        try { if (TICKERS[ti](dt) === false) TICKERS.splice(ti, 1); }
        catch(e){ boom("ticker", e); TICKERS.splice(ti, 1); }
      }
      VIEWERS.forEach(function(V){
        try {
          V.resize();
          V.step(dt);
          if (V.stepHold) V.stepHold(dt);
          V.render();
        } catch(e){ boom("viewer", e); }
      });
    } catch(e){ boom("frame", e); }
    finally { requestAnimationFrame(frame); }   /* never stop scheduling */
  }
  requestAnimationFrame(frame);
})();
</script>
